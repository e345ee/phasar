name: CFLFieldSens diagnostic

on:
  push:
    branches:
      - codex/ci-cflfieldsens-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cflfieldsens-release-llvm16:
    name: ubuntu-24.04 clang-20 Release LLVM16 diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: diagnostic-cflfieldsens-ubuntu-24.04-llvm16-release

      - name: Install Phasar Dependencies
        shell: bash
        run: |
          ./utils/InstallAptDependencies.sh \
            --llvm-version 16 \
            --noninteractive \
            tzdata \
            ccache \
            clang-20 \
            libclang-rt-20-dev \
            clang-tools-20 \
            gdb

      - name: Print runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          lscpu
          free -h
          df -h
          ulimit -a
          clang-20 --version
          clang++-20 --version
          llvm-config-16 --version
          cmake --version
          ninja --version

      - name: Configure and build Phasar
        env:
          CXX: clang++-20
          CC: clang-20
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_PHASAR_CLANG=OFF \
            -DPHASAR_USE_Z3=ON \
            -DPHASAR_BUILD_MODULES=ON \
            -DPHASAR_LLVM_VERSION=16 \
            -DPHASAR_ENABLE_DYNAMIC_LOG=OFF \
            -DPHASAR_BUILD_DYNLIB=ON \
            -DPHASAR_ENABLE_SANITIZERS=ON \
            -G Ninja
          ninja -C build
          cmake --build ./build --target LLFileGeneration

      - name: Run diagnostic tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-diagnostics

          export LLVM_SYMBOLIZER_PATH
          LLVM_SYMBOLIZER_PATH="$(command -v llvm-symbolizer-16 || command -v llvm-symbolizer || true)"
          export ASAN_OPTIONS="detect_leaks=0:abort_on_error=1:print_stacktrace=1:symbolize=1"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1:symbolize=1"
          ulimit -c unlimited || true

          ctest --test-dir build/unittests --show-only=json-v1 \
            > ci-diagnostics/ctest-tests.json || true

          pushd build/unittests
          set +e
          ctest --progress --output-on-failure --verbose -j 4 \
            -E "(LLVMBasedCFGTest|LLVMBasedICFGGlobCtorDtorTest|IDEInstInteractionAnalysisTest|IFDSUninitializedVariablesTest|IDEGeneralizedLCATest|IDEExtendedTaintAnalysisTest|IDEFeatureTaintAnalysis)"
          ctest_status=$?
          set -e
          popd

          cp -R build/unittests/Testing ci-diagnostics/unittests-testing || true

          if [ "$ctest_status" -ne 0 ]; then
            echo "::group::CFLFieldSensTest Basic_22 under gdb after ctest failure"
            gdb -batch \
              -ex "set pagination off" \
              -ex "handle SIGILL stop print pass" \
              -ex "run --gtest_filter=CFLFieldSensTest/0.Basic_22 --gtest_color=no" \
              -ex "bt full" \
              -ex "info registers" \
              -ex "x/24i \$pc-32" \
              --args ./build/unittests/PhasarLLVM/DataFlow/IfdsIde/CFLFieldSensTest
            echo "::endgroup::"
            exit "$ctest_status"
          fi

          ./build/unittests/PhasarLLVM/DataFlow/IfdsIde/CFLFieldSensTest \
            --gtest_filter=CFLFieldSensTest/0.Basic_22 \
            --gtest_repeat=100 \
            --gtest_color=no

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cflfieldsens-diagnostic-logs
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
