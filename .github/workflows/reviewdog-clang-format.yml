name: Phasar clang-format review runner

on:
  push:
    branches: [ codex/ci-cflfieldsens-diagnostic ]
  pull_request:
    branches: [ master, development ]

jobs:
  format:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tool: [ clang-format ]
        include:
          - tool: clang-format
            install: |
              sudo apt-get update
              sudo apt-get -y install --no-install-recommends clang-format-19
            regex: \.(h|c|hpp|cpp)$
            command: clang-format-19 --style=file -i

    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        shell: bash
        run: ${{ matrix.install }}

      - name: Fetch Base Branch
        shell: bash
        run: |
          BASE_REF="${GITHUB_BASE_REF:-development}"
          git fetch --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Run Tool
        shell: bash
        run: |
          BASE_REF="${GITHUB_BASE_REF:-development}"
          FILES=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}" HEAD | egrep "${{ matrix.regex }}" || true)
          [ -z "$FILES" ] || (${{ matrix.command }} $FILES && git diff --diff-filter=M $FILES)

      - name: Add Suggestions
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: ${{ matrix.tool }}
          filter_mode: diff_context
          level: warning
